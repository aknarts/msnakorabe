  founder:
    name: "Městská část Praha 8"
    url: "https://www.praha8.cz"
  motto: "Jak si loďku postavíme, tak si na ní zajezdíme."
  hero_heading: "Vítejte na místě, kde dětství má pevnou palubu"
  hero_body:
    - >-
      Naše mateřská škola je rodinného typu – a není to jen označení. Známe svá jména,
      známe své radosti i obavy. Vytváříme prostředí, kde se děti cítí bezpečně,
      přijímané a důležité.
    - >-
      Máme stálý a profesionální pedagogický sbor, který svou práci bere jako poslání.
      Neustále se vzděláváme a hledáme nové cesty, jak dětem předávat svět s respektem
      a porozuměním. Učíme prožitkem – protože věříme, že to, co si dítě samo vyzkouší,
      procítí a objeví, si odnese na celý život.
    - >-
      Zakládáme si na vztazích, důvěře a spolupráci s rodinou. Jen když držíme společný
      směr, může být cesta klidná a radostná.
    - >-
      Těšíme se, až přistoupíte na naši palubu. Společně vyplujeme a budeme vaše děti
      s péčí a jistotou provázet na jejich první velké cestě.
  philosophy: >-
    Uspokojovat potřeby dětí, nabízet podněty pro rozvoj individuálního potenciálu,
    intelektuálních, citových a sociálních schopností. Umožnit dítěti prostřednictvím
    prožitků získávat zkušenost, probouzet zájem o hodnoty, vést dítě k osvojení postojů
    a dovedností, které budou dobrým základem do života, které pomohou dosáhnout cíle =
    stát se zdravou, autentickou, vnitřně integrovanou a socializovanou osobností.
  goal: "MÍT ZDRAVÍ, DUŠEVNÍ POHODU A PŘÍZNIVOU ŽIVOTNÍ PERSPEKTIVU"
  intro: >-
    Naše mateřská škola je loďka, kterou stavíme z pevných, ale pružných základů.
    Tak, jak si na její stavbě dáme záležet, tak nám bude sloužit. Krásně nás poveze
    v klidném proudu, ale vydrží i v bouři a bezpečně nás doveze k našemu cíli.
  school_type: >-
    Naše mateřské školy jsou školou rodinného typu, mezi naše hlavní oblasti zájmů
    patří mravní, citová a tělesná výchova. Snažíme se v dětech posilovat vlastní
    sebedůvěru, samostatnost a schopnost rozhodování se, vše maximálně hravou formou.
  program_name: "NA JEDNÉ LODI – KORÁBU"
  program_description: >-
    Pro sjednocení těchto aktivit a dosažení našich cílů jsme vytvořili vlastní
    vzdělávací program „NA JEDNÉ LODI – KORÁBU", který děti provází po celý rok.
  garden: >-
    Školka nabízí prostornou zahradu parkového typu, jejíž členitost umožňuje využití
    k funkčním, estetickým a prožitkovým variantám výchovných činností a je vybavena
    moderními herními prvky a nově také záhonky s plodinami, o které se děti samy starají.
  kitchen_description: >-
    Stravování dětí zajišťují školní jídelny. Snažíme se dětem poskytovat pestrou
    a vyváženou stravu, k čemuž dopomáhají špičkové paní kuchařky.
  kitchen_awards:
    - '1. místo v soutěži „Školní jídelna chutně a zdravě" pořádané HHMP (2016/2017)'
    - '4× finále celostátní soutěže „O nejlepší školní oběd"'
    - '4. místo z 90 týmů školních jídelen z celé ČR (2013)'
    - 'Cena veřejnosti (2014)'
  hours: "6:30 / 7:00 – 17:00"
  hours_note: >-
    Děti splňující povinnou předškolní docházku přichází do MŠ od 7:00 do 9:00 hodin.
    Doporučujeme příchod do 8:30 hodin, kdy začínají pro děti různé aktivity a řízené činnosti.
  absence_email: "skolkanakorabeomluvydeti@seznam.cz"
