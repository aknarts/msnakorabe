name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production build (for FORPSI hosting)
      - name: Build for production
        run: npm run build

      - name: Package dist as zip
        run: cd dist && zip -r ../msnakorabe-dist.zip .

      - name: Upload dist zip
        uses: actions/upload-artifact@v4
        with:
          name: msnakorabe-dist
          path: msnakorabe-dist.zip

      # GitHub Pages build
      - name: Build for GitHub Pages
        run: npm run build
        env:
          SITE_URL: https://aknarts.github.io
          BASE_PATH: /msnakorabe

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Find the previous release tag
          PREV_TAG=$(git tag --list 'build-*' --sort=-version:refname | head -n 1)

          {
            echo 'RELEASE_BODY<<RELEASE_EOF'

            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..HEAD"
              echo "## Změny od posledního releasu ($PREV_TAG)"
            else
              RANGE="HEAD"
              echo "## První release"
            fi

            echo ""

            # Commit list with author
            echo "### Commity"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "$RANGE" --pretty=format:"- %s (%an)" --no-merges
            else
              git log --pretty=format:"- %s (%an)" --no-merges -20
            fi

            echo ""
            echo ""

            # Diffstat summary
            echo "### Změněné soubory"
            echo ""
            echo '```'
            if [ -n "$PREV_TAG" ]; then
              git diff --stat "$PREV_TAG"..HEAD -- ':!archive' ':!node_modules'
            else
              echo "(první build — všechny soubory)"
            fi
            echo '```'

            echo 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download dist zip
        uses: actions/download-artifact@v4
        with:
          name: msnakorabe-dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ steps.notes.outputs.RELEASE_BODY }}
          files: msnakorabe-dist.zip
